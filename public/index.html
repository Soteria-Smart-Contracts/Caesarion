<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesarion</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --sidebar-bg: #252526;
            --header-bg: #333333;
            --border-color: #3e3e42;
            --text-color: #cccccc;
            --text-muted: #858585;
            --accent-color: #007acc;
            --accent-hover: #0098ff;
            --chat-bg: #1e1e1e;
            --agent-msg-bg: #2d2d2d;
            --user-msg-bg: #004a77;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* Top Navigation Bar */
        header {
            background-color: var(--header-bg);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 500;
            border-radius: 3px;
            padding: 6px 12px;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        button:hover:not(:disabled) { background-color: var(--accent-hover); }
        button:disabled { background-color: #555; color: #888; cursor: not-allowed; }

        #resetBtn { background-color: #c74e4e; }
        #resetBtn:hover:not(:disabled) { background-color: #e55c5c; }

        #settingsBtn {
            background: none;
            font-size: 1.2rem;
            padding: 0;
            margin-right: 10px;
        }
        #settingsBtn:hover { background: none; color: var(--accent-hover); }

        /* Main App Layout */
        .app-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Left Sidebar (File Tree) */
        .sidebar {
            width: 250px;
            min-width: 200px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 10px 15px;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        #fileTree {
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
            white-space: pre-wrap;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        #fileTree a { color: var(--accent-color); text-decoration: none; }
        #fileTree a:hover { text-decoration: underline; color: var(--accent-hover); }

        /* Main Chat Area */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
        }

        #logs {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .user-msg, .agent-msg {
            padding: 12px 16px;
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            word-wrap: break-word;
        }

        .user-msg {
            background-color: var(--user-msg-bg);
            color: #ffffff;
            align-self: flex-end;
            max-width: 80%;
        }

        .agent-msg {
            background-color: var(--agent-msg-bg);
            color: #d4d4d4;
            align-self: flex-start;
            width: 100%;
            box-sizing: border-box;
            border-left: 3px solid var(--accent-color);
        }

        /* Chat Input Area */
        .chat-input-container {
            padding: 15px 20px;
            background-color: var(--header-bg);
            border-top: 1px solid var(--border-color);
        }

        .chat-controls {
            display: flex;
            gap: 10px;
            align-items: stretch;
            max-width: 900px;
            margin: 0 auto;
        }

        #task {
            flex-grow: 1;
            height: 44px; /* Fixed small initial height, auto-expanded by JS if needed */
            min-height: 44px;
            max-height: 200px;
            resize: none;
            padding: 12px;
            background-color: #3c3c3c;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        #task:focus {
            outline: 1px solid var(--accent-color);
            border-color: var(--accent-color);
        }

        #startBtn {
            padding: 0 20px;
            height: 44px;
        }

        /* Settings Modal */
        #settingsModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        #settingsContent {
            background: var(--sidebar-bg);
            padding: 25px;
            border-radius: 6px;
            width: 400px;
            max-width: 90%;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #settingsContent h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #fff;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 15px; }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            background-color: #3c3c3c;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 3px;
        }
        .form-group input:focus {
            outline: 1px solid var(--accent-color);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        #closeSettings {
            background-color: var(--accent-color);
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }
    </style>
</head>
<body>

    <header>
        <h1>Caesarion</h1>
        <div class="header-controls">
            <button id="settingsBtn" title="Settings">&#9881;</button>
            <button id="resetBtn">Reset Session</button>
        </div>
    </header>

    <div id="settingsModal">
        <div id="settingsContent">
            <h2>API Settings</h2>
            <div class="form-group">
                <label for="apiUrl">API Base URL</label>
                <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1">
            </div>

            <div class="form-group">
                <label for="apiKey">API Key</label>
                <input type="password" id="apiKey" placeholder="sk-...">
            </div>

            <div class="form-group">
                <label for="model">Model</label>
                <input type="text" id="model" value="gpt-4o-mini">
            </div>
            <div class="modal-actions">
                <button id="closeSettings">Save & Close</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">Workspace (/tmp)</div>
            <div id="fileTree">Loading...</div>
        </aside>

        <main class="main-content">
            <div id="logs">
                <!-- Chat log goes here -->
            </div>

            <div class="chat-input-container">
                <div class="chat-controls">
                    <textarea id="task" placeholder="Message Caesarion..."></textarea>
                    <button id="startBtn">Send</button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
