<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesarion</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; position: relative; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { width: 100%; padding: 8px; box-sizing: border-box; height: 100px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover:not(:disabled) { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #logs { margin-top: 20px; margin-bottom: 20px; background-color: #2b2b2b; color: #a9b7c6; padding: 15px; border: 1px solid #ddd; height: 400px; overflow-y: auto; white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; border-radius: 4px; display: flex; flex-direction: column; gap: 10px; }
        .user-msg { background-color: #444; color: white; padding: 10px; border-radius: 4px; align-self: flex-end; max-width: 80%; }
        .agent-msg { background-color: #333; color: #a9b7c6; padding: 10px; border-radius: 4px; align-self: flex-start; width: 100%; box-sizing: border-box; }
        .chat-controls { display: flex; gap: 10px; align-items: stretch; margin-top: 10px; }
        #task { flex-grow: 1; height: 60px; }

        h1 { margin-left: 40px; } /* Leave space for gear */
        #settingsBtn { position: absolute; top: 20px; left: 20px; background: none; border: none; font-size: 24px; color: #333; cursor: pointer; padding: 0; }
        #settingsBtn:hover { color: #007bff; }

        #settingsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        #settingsContent { background: white; padding: 30px; border-radius: 8px; width: 400px; max-width: 90%; }
        #closeSettings { float: right; background: #dc3545; padding: 5px 10px; margin-bottom: 15px; }

        #fileTree { margin-top: 20px; background-color: #f8f9fa; padding: 15px; border: 1px solid #ddd; height: 200px; overflow-y: auto; white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; border-radius: 4px; }
        #fileTree a { color: #007bff; text-decoration: none; }
        #fileTree a:hover { text-decoration: underline; }
        .controls { display: flex; gap: 10px; align-items: center; }
        #resetBtn { background-color: #dc3545; }
        #resetBtn:hover:not(:disabled) { background-color: #c82333; }
    </style>
</head>
<body>

    <button id="settingsBtn" title="Settings">&#9881;</button>

    <h1>Caesarion Agent</h1>

    <div id="settingsModal">
        <div id="settingsContent">
            <button id="closeSettings">Close</button>
            <h2>API Settings</h2>
            <div class="form-group">
                <label for="apiUrl">API Base URL</label>
                <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1">
            </div>

            <div class="form-group">
                <label for="apiKey">API Key</label>
                <input type="password" id="apiKey" placeholder="sk-...">
            </div>

            <div class="form-group">
                <label for="model">Model</label>
                <input type="text" id="model" value="gpt-4o-mini">
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="resetBtn">Reset Session</button>
    </div>

    <h2>Chat Log (Workspace: /tmp)</h2>
    <div id="logs"></div>

    <div class="chat-controls">
        <textarea id="task" placeholder="Send a message to Caesarion..."></textarea>
        <button id="startBtn">Send</button>
    </div>

    <h2>Workspace File Tree</h2>
    <div id="fileTree">Loading...</div>

    <script src="app.js"></script>
</body>
</html>
