<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesarion</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { width: 100%; padding: 8px; box-sizing: border-box; height: 100px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover:not(:disabled) { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #logs { margin-top: 20px; background-color: #2b2b2b; color: #a9b7c6; padding: 15px; border: 1px solid #ddd; height: 400px; overflow-y: auto; white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>Caesarion Agent</h1>

    <div class="form-group">
        <label for="apiUrl">API Base URL</label>
        <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1">
    </div>

    <div class="form-group">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-...">
    </div>

    <div class="form-group">
        <label for="model">Model</label>
        <input type="text" id="model" value="gpt-4o-mini">
    </div>

    <div class="form-group">
        <label for="githubToken">GitHub Personal Access Token (Optional)</label>
        <input type="password" id="githubToken" placeholder="ghp_...">
    </div>

    <div class="form-group">
        <label for="task">Task Description</label>
        <textarea id="task" placeholder="Describe the task for Caesarion to perform..."></textarea>
    </div>

    <button id="startBtn">Start Task</button>

    <h2>Logs</h2>
    <div id="logs"></div>

    <script src="app.js"></script>
</body>
</html>
